[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "mirage-antidetect"
version = "0.3.0"
description = "给 MediaCrawler 打入五层反检测加固 + 拟人互动引擎的工具集（仅供学习研究）"
readme = "README.md"
requires-python = ">=3.9"
license = { text = "Non-Commercial / Research-Only" }
authors = [{ name = "millennialdreamer" }]
keywords = ["anti-detection", "mediacrawler", "stealth", "crawler-hardening", "fingerprint"]
classifiers = [
    "Programming Language :: Python :: 3",
    "Intended Audience :: Developers",
    "Topic :: Security",
]

[project.urls]
Homepage = "https://github.com/millennialdreamer/mirage"

# 核心 CLI（apply/doctor）零额外依赖；只有指纹自检/benchmark 需要浏览器。
[project.optional-dependencies]
browser = ["playwright>=1.40"]

[project.scripts]
mirage = "mirage.cli:main"

# 关键：把 scripts/ 目录映射成 mirage 包，**不物理重命名目录** ——
# 既保住 Claude Code skill 的 scripts/ 结构，又能 pip install。
[tool.setuptools]
packages = ["mirage"]

[tool.setuptools.package-dir]
mirage = "scripts"

# weekly_maintenance.sh 等非 .py 不打进包（包内只留 Python 模块）
[tool.setuptools.exclude-package-data]
mirage = ["*.sh"]
