[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "mirage-antidetect"
version = "0.6.0"
description = "Behavior-layer anti-detection hardening for MediaCrawler, plus a human-like interaction engine and a soft-ban early-warning radar (research use only)"
readme = "README.md"
requires-python = ">=3.9"
license = { text = "Non-Commercial / Research-Only" }
authors = [{ name = "millennialdreamer" }]
keywords = ["anti-detection", "mediacrawler", "stealth", "crawler-hardening", "fingerprint"]
classifiers = [
    "Programming Language :: Python :: 3",
    "Intended Audience :: Developers",
    "Topic :: Security",
]

[project.urls]
Homepage = "https://github.com/millennialdreamer/mirage"

# The core CLI (apply / doctor / canary / radar / profile) has zero third-party deps.
# Only fingerprint verification needs a browser driver.
[project.optional-dependencies]
browser = ["patchright>=1.40"]        # preferred: drop-in Playwright patch, closes the CDP Runtime.Enable leak
browser-plain = ["playwright>=1.40"]  # fallback: stock Playwright (CDP leak remains; injected scripts cannot fix it)

[project.scripts]
mirage = "mirage.cli:main"

# Map scripts/ onto the `mirage` package WITHOUT renaming the directory: keeps the flat
# scripts/ layout that the Claude Code skill expects, while still being pip-installable.
[tool.setuptools]
packages = ["mirage"]

[tool.setuptools.package-dir]
mirage = "scripts"

# Keep non-.py files (weekly_maintenance.sh etc.) out of the built package.
[tool.setuptools.exclude-package-data]
mirage = ["*.sh"]

[tool.ruff]
line-length = 160                   # English prose runs longer than the original Chinese;
                                    # also leaves room for the deliberately aligned scoring tables
target-version = "py39"

[tool.ruff.lint]
select = ["E", "F", "W", "I"]      # errors / unused / warnings / import sorting
ignore = ["E402", "E731"]          # E402: three-context import fallbacks are deliberately late
                                   # E731: lambdas are used as the scoring model

[tool.mypy]
ignore_missing_imports = true       # optional deps (playwright / zoneinfo) are not required
warn_unused_ignores = false
disable_error_code = ["no-redef"]   # try/except import fallbacks legitimately redefine names
